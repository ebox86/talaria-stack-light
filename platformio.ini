[platformio]
; Keep plain `pio run` / `pio run -t upload` targeting only the real board.
; The native test env is opt-in via `pio test -e native` or `pio run -e native`.
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32
board = esp32dev
framework = arduino


monitor_speed = 115200

build_flags =
  -D CORE_DEBUG_LEVEL=3

lib_deps =
  bblanchon/ArduinoJson@^7.0.0

; Network (OTA) upload instead of the physical IO0/USB-UART procedure.
; The OTA password lives in include/secrets.h (gitignored) -- pass it via
; an env var rather than committing it to this file:
;   (bash)       export TALARIA_OTA_PASSWORD=<value from secrets.h>
;   (PowerShell) $env:TALARIA_OTA_PASSWORD = "<value from secrets.h>"
;   pio run -e wt32-eth01-ota -t upload
[env:wt32-eth01-ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = talaria-stack-01.local
upload_flags =
  --auth=${sysenv.TALARIA_OTA_PASSWORD}

; Host-side unit tests for pure logic (status_engine's TalariaStatus ->
; SignalState mapping, condition_registry's priority/TTL rules,
; heartbeat_monitor's staleness timing). Runs on your machine, no board
; or wiring needed:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter =
  +<*>
  -<main.cpp>
  -<network.cpp>
  -<network.h>
  -<light_controller.cpp>
  -<light_controller.h>
  -<api_server.cpp>
  -<api_server.h>
  -<ota.cpp>
  -<ota.h>